<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FrameRelay</title></head>
<body><main><canvas id="screen"></canvas><footer id="controls"><strong>FrameRelay</strong><span id="status" role="status">Starting Discord authorization…</span><div class="volume-controls"><button id="mute" type="button" aria-label="Mute audio">🔊</button><input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume"></div><button id="connect" disabled>Connect</button><button id="play" hidden>Play video and audio</button><button id="view-logs" type="button" aria-haspopup="dialog" aria-expanded="false">Ver logs</button><button id="hide-controls" type="button" aria-label="Hide controls" title="Hide controls">⌄</button></footer><button id="show-controls" type="button" aria-label="Show controls" title="Show controls" hidden>⌃</button><dialog id="logs-dialog" aria-labelledby="logs-title"><header><h2 id="logs-title">Diagnósticos da Activity</h2><button id="close-logs" type="button">Fechar</button></header><p>Eventos recentes de conexão e reprodução. Credenciais não são incluídas.</p><pre id="logs-output" tabindex="0" aria-live="polite"></pre><footer><span id="logs-copy-status" role="status"></span><button id="copy-logs" type="button">Copiar</button><button id="clear-logs" type="button">Limpar</button></footer></dialog></main><script type="module" src="/src/main.ts"></script></body></html>
